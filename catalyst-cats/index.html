<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1030" />
    <meta name="description" content="Catalyst Cats playable demo: survive 75 seconds as a cat wizard. Mix fire and frost for elemental combos." />
    <title>Catalyst Cats — Playable Demo</title>
    <link rel="icon" type="image/png" href="./assets/ui/app_icon_192.png" />
    <style>
      @font-face {
        font-family: 'Jua';
        src: url('./fonts/Jua-sub.woff2') format('woff2');
        font-display: swap;
      }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #120a22; overflow: hidden;
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Jua', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      /* the game takes the whole frame (square Player Card iframe up to full screen); Phaser EXPAND keeps a 720x720 stage visible */
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #game canvas { display: block; }

      .xd-overlay {
        position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center;
        gap: 2.2vmin; padding: 4vmin; box-sizing: border-box; text-align: center;
        background: radial-gradient(ellipse at 50% 35%, rgba(61, 42, 102, 0.94) 0%, rgba(18, 10, 34, 0.97) 72%);
        color: #f6e7ff; touch-action: manipulation;
      }
      .xd-overlay.show { display: flex; }
      .xd-overlay.dim { background: radial-gradient(ellipse at 50% 40%, rgba(43, 29, 74, 0.86) 0%, rgba(18, 10, 34, 0.93) 75%); }
      .xd-logo { width: min(68vmin, 420px); height: auto; filter: drop-shadow(0 1vmin 1.4vmin rgba(0, 0, 0, 0.45)); }
      .xd-hero { width: min(30vmin, 190px); height: auto; margin: -1vmin 0 -2vmin; animation: xd-bob 2.4s ease-in-out infinite; }
      @keyframes xd-bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-1.6vmin) rotate(2deg); } }
      .xd-sub { margin: 0; font-size: max(12px, 3.6vmin); color: #b9a6d9; line-height: 1.3; max-width: 92vmin; }
      .xd-sub b { color: #ffd35a; font-weight: normal; }
      .xd-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 1.6vmin; box-sizing: border-box;
        border: 0; border-radius: 999px; cursor: pointer; text-decoration: none; font-family: inherit; line-height: 1;
        padding: 2.6vmin 7vmin; font-size: max(15px, 5.4vmin); color: #2a1b3d; background: #ffd35a;
        box-shadow: 0 1.1vmin 0 #b8892a, 0 1.6vmin 3vmin rgba(0, 0, 0, 0.35);
        transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
      }
      .xd-btn:active { transform: translateY(0.8vmin); box-shadow: 0 0.3vmin 0 #b8892a; }
      .xd-btn:focus-visible { outline: 3px solid #f6e7ff; outline-offset: 3px; }
      .xd-btn[disabled] { cursor: default; opacity: 0.75; }
      .xd-btn.play { font-size: max(18px, 7vmin); padding: 2.8vmin 10vmin; }
      .xd-btn.store { background: #7ee04a; color: #11301a; box-shadow: 0 1.1vmin 0 #4c9a2a, 0 1.6vmin 3vmin rgba(0, 0, 0, 0.35); width: min(84vmin, 520px); }
      .xd-btn.store:active { box-shadow: 0 0.3vmin 0 #4c9a2a; }
      .xd-btn.store svg { width: 1.1em; height: 1.1em; flex: none; }
      .xd-btn.again { background: transparent; color: #f6e7ff; box-shadow: none; border: 0.5vmin solid rgba(246, 231, 255, 0.55); font-size: max(13px, 4.2vmin); padding: 1.8vmin 6vmin; }
      .xd-btn.again:active { transform: translateY(0.4vmin); }
      .xd-hint { margin: 0; font-size: max(10px, 2.9vmin); color: #b9a6d9; opacity: 0.85; line-height: 1.35; }

      #xd-result h1 { margin: 0; font-weight: normal; font-size: max(20px, 8vmin); color: #ffd35a; text-shadow: 0 0.6vmin 0 #2a1b3d; }
      #xd-result h1.lose { color: #ff8a96; }
      .xd-score-label { margin: 0; font-size: max(11px, 3.4vmin); color: #b9a6d9; letter-spacing: 0.08em; text-transform: uppercase; }
      .xd-score { margin: -1vmin 0 0; font-size: max(30px, 13vmin); line-height: 1; color: #fff; text-shadow: 0 0.8vmin 0 #2a1b3d; }
      .xd-stats { display: flex; gap: 2vmin; flex-wrap: wrap; justify-content: center; margin: 0.5vmin 0 1.5vmin; }
      .xd-stat { background: rgba(10, 4, 22, 0.45); border-radius: 2vmin; padding: 1.2vmin 2.6vmin; font-size: max(11px, 3.4vmin); color: #b9a6d9; }
      .xd-stat b { display: block; font-weight: normal; font-size: max(15px, 5.2vmin); color: #f6e7ff; }
      .xd-actions { display: flex; flex-direction: column; align-items: center; gap: 2.4vmin; }

      /* small sound toggle, always reachable (muted by default) */
      #xd-mute {
        position: fixed; z-index: 60; top: max(1.6vmin, 6px); right: max(1.6vmin, 6px);
        width: max(34px, 8.4vmin); height: max(34px, 8.4vmin); padding: 0; border-radius: 50%;
        border: 2px solid rgba(246, 231, 255, 0.5); background: rgba(18, 10, 34, 0.72); color: #f6e7ff; cursor: pointer;
        display: flex; align-items: center; justify-content: center; touch-action: manipulation;
      }
      #xd-mute svg { width: 58%; height: 58%; }
      #xd-mute .on { display: none; }
      #xd-mute[aria-pressed='true'] .on { display: block; }
      #xd-mute[aria-pressed='true'] .off { display: none; }
      #xd-mute:focus-visible { outline: 3px solid #ffd35a; outline-offset: 2px; }
    </style>
    <script type="module" crossorigin src="./assets/index-C-0h7tBi.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-DFK5Ua9d.js">
  </head>
  <body>
    <div id="game"></div>

    <div id="xd-start" class="xd-overlay show" role="dialog" aria-label="Catalyst Cats demo">
      <img class="xd-logo" alt="Catalyst Cats" data-img="ui_logo" />
      <img class="xd-hero" alt="" data-img="heroes_mochi" />
      <p class="xd-sub">Survive <b>75 seconds</b> as a cat wizard.<br />Mix <b>fire + frost</b> for elemental combos!</p>
      <button type="button" class="xd-btn play" id="xd-play" disabled>Loading…</button>
      <p class="xd-hint">Drag (or WASD / arrows) to move · spells cast themselves</p>
    </div>

    <div id="xd-result" class="xd-overlay dim" role="dialog" aria-label="Result">
      <h1 id="xd-title">Time's up!</h1>
      <p class="xd-score-label">Score</p>
      <p class="xd-score" id="xd-score">0</p>
      <div class="xd-stats">
        <div class="xd-stat"><b id="xd-kills">0</b>foes</div>
        <div class="xd-stat"><b id="xd-combos">0</b>combos</div>
        <div class="xd-stat"><b id="xd-level">1</b>level</div>
      </div>
      <div class="xd-actions">
        <a class="xd-btn store" id="xd-store" target="_blank" rel="noopener" href="https://play.google.com/store/apps/details?id=com.revstudio.catalystcats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 2.6v18.8c0 .5.5.8.9.6l16.3-9.4c.4-.2.4-.9 0-1.1L4.9 2c-.4-.2-.9.1-.9.6z" /></svg>
          Continue on Google Play
        </a>
        <button type="button" class="xd-btn again" id="xd-again">Play again</button>
      </div>
    </div>

    <button type="button" id="xd-mute" aria-pressed="false" aria-label="Sound off. Turn sound on" title="Sound">
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3z" /><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none" /></svg>
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3z" /><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none" /></svg>
    </button>

  </body>
</html>
