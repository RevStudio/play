<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0712">
<meta name="robots" content="noindex">
<meta name="description" content="대를 이어, 숫자의 한계를 부숴라. 브라우저에서 바로 하는 테스트 버전 v1.2.6">
<meta property="og:type" content="website">
<meta property="og:title" content="한계돌파 용사 — 웹 테스트">
<meta property="og:description" content="대를 이어, 숫자의 한계를 부숴라. 브라우저에서 바로 하는 테스트 버전 v1.2.6">
<meta property="og:image" content="https://revstudio.github.io/play/limit-break-hero/card.jpg">
<meta property="og:url" content="https://revstudio.github.io/play/limit-break-hero/">
<meta name="twitter:card" content="summary_large_image">
<title>한계돌파 용사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
  /* One dark arcade look shared with the game: full-bleed canvas, a loading card that
     counts up through the game's number units while the engine downloads. */
  :root {
    --night: #0b0712;      /* page ground, matches the game's clear colour */
    --ink: #f4ead2;        /* body text */
    --gold: #ffd36a;       /* title, filled bar, lit units */
    --ember: #ff8a2a;      /* bar gradient end, error accent */
    --dim: #6d5f86;        /* unlit units, borders */
    --panel: #170f24;      /* bar track, error card */
    --font-title: "Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --font-body: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--night); color: var(--ink); overflow: hidden;
    touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    font: 16px/1.5 var(--font-body);
  }
  #canvas { display: block; outline: none; touch-action: none; }
  #canvas:focus { outline: none; }

  #loader {
    position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    background: radial-gradient(120% 70% at 50% 38%, #2b1838 0%, var(--night) 62%);
    transition: opacity .5s ease;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  .card { width: min(360px, 100%); display: grid; gap: 22px; text-align: center; }
  .title {
    margin: 0; font: 56px/1.05 var(--font-title); letter-spacing: .01em; text-wrap: balance;
    background: linear-gradient(180deg, #fffbe8 0%, var(--gold) 55%, var(--ember) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #2a0f00) drop-shadow(0 0 18px rgba(255, 160, 60, .25));
  }
  .tagline { margin: -10px 0 0; color: var(--ink); opacity: .82; font-size: 17px; }
  .units { display: flex; justify-content: center; gap: 10px; font: 26px/1 var(--font-title); }
  .units span { color: var(--dim); transition: color .25s, transform .25s; }
  .units span.lit { color: var(--gold); transform: translateY(-3px); text-shadow: 0 0 12px rgba(255, 211, 106, .55); }
  .bar { height: 14px; border-radius: 7px; background: var(--panel); border: 2px solid var(--dim); overflow: hidden; }
  .fill { height: 100%; width: 0%; background: linear-gradient(180deg, #fff1b8, var(--gold) 45%, var(--ember)); transition: width .15s linear; }
  .status { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--ink); opacity: .9; }
  .status .mb { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tip { margin: 0; font-size: 14px; color: var(--ink); opacity: .6; }
  .error {
    display: grid; gap: 8px; padding: 16px; border-radius: 14px; text-align: left;
    background: var(--panel); border: 2px solid var(--ember); color: var(--ink);
  }
  .error[hidden], #loader[hidden] { display: none; }
  .error strong { font: 20px/1.3 var(--font-title); color: var(--ember); }
  .error p { margin: 0; font-size: 15px; }
  .error code { font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--dim); word-break: break-all; }
  @media (prefers-reduced-motion: reduce) { .units span, .fill, #loader { transition: none; } }
</style>

</head>
<body>
<canvas id="canvas" aria-label="한계돌파 용사 게임 화면"></canvas>

<div id="loader" role="status" aria-live="polite">
  <div class="card">
    <h1 class="title">한계돌파 용사</h1>
    <p class="tagline">대를 이어, 숫자의 한계를 부숴라</p>
    <div class="units" aria-hidden="true"><span>만</span><span>억</span><span>조</span><span>경</span><span>해</span><span>자</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="status"><span id="step">게임 엔진 받는 중</span><span class="mb" id="mb">0.0 / 0.0 MB</span></div>
    <p class="tip">화면을 누른 채 드래그하면 이동 · 적에게 닿으면 자동 전투</p>
    <div class="error" id="error" hidden>
      <strong>게임을 불러오지 못했어요</strong>
      <p id="error-text">페이지를 새로고침해 주세요. 계속 안 되면 최신 Chrome, Safari, Edge에서 열어 주세요.</p>
      <code id="error-detail"></code>
    </div>
  </div>
</div>

<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":37073704,"index.wasm":1508095},"focusCanvas":true,"gdextensionLibs":["librpgcore.web.template_release.wasm32.nothreads.wasm"],"godotPoolSize":4};
const PACKED = {"index.wasm":{"file":"engine.gz.wasm","files":["engine.gz.wasm"],"type":"application/wasm","size":1508095,"gz":580694},"index.pck":{"file":"data.gz.wasm","files":["data.gz.wasm","data.1.gz.wasm","data.2.gz.wasm"],"type":"application/octet-stream","size":37073704,"gz":35945039},"index.side.wasm":{"file":"side.gz.wasm","files":["side.gz.wasm"],"type":"application/wasm","size":44077147,"gz":10473925}};
const GODOT_THREADS_ENABLED = false;

// The engine (.wasm) and game data (.pck) are published gzip-compressed. Godot's loader
// asks for index.wasm / index.pck; hand it the inflated bytes from the .gz files instead.
(function () {
  const nativeFetch = window.fetch.bind(window);
  const totalGz = Object.values(PACKED).reduce((a, p) => a + p.gz, 0);
  const got = {};
  const fill = document.getElementById('fill');
  const mb = document.getElementById('mb');
  const units = document.querySelectorAll('.units span');
  window.__loaderProgress = function (k) {
    fill.style.width = (k * 100).toFixed(1) + '%';
    units.forEach((u, i) => u.classList.toggle('lit', k >= (i + 1) / units.length - 1e-6));
  };
  function report() {
    const n = Object.values(got).reduce((a, b) => a + b, 0);
    mb.textContent = (n / 1e6).toFixed(1) + ' / ' + (totalGz / 1e6).toFixed(1) + ' MB';
    window.__loaderProgress(0.9 * n / totalGz);
  }
  report();
  async function fetchPacked(p, init) {
    document.getElementById('step').textContent = p.type === 'application/wasm' ? '게임 엔진 받는 중' : '게임 데이터 받는 중';
    const parts = [];
    let n = 0;
    for (const f of (p.files || [p.file])) {
      const res = await nativeFetch(f, init);
      if (!res.ok) throw new Error(f + ': HTTP ' + res.status);
      const reader = res.body.getReader();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value);
        n += value.byteLength;
        got[p.file] = Math.min(n, p.gz);
        report();
      }
    }
    let bytes = new Uint8Array(n);
    let o = 0;
    for (const c of parts) { bytes.set(c, o); o += c.byteLength; }
    // the host may already have inflated it (Content-Encoding); only inflate real gzip
    if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
      if (!('DecompressionStream' in window)) throw new Error('DecompressionStream unavailable');
      const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      bytes = new Uint8Array(await new Response(ds).arrayBuffer());
    }
    return new Response(bytes, { status: 200, headers: { 'Content-Type': p.type, 'Content-Length': String(bytes.byteLength) } });
  }
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    const name = url.split('?')[0].split('#')[0].split('/').pop();
    const p = PACKED[name];
    return p ? fetchPacked(p, init) : nativeFetch(input, init);
  };
}());
</script>
<script src="index.js"></script>
<script>
(function () {
  const loader = document.getElementById('loader');
  function fail(err) {
    console.error(err);
    const msg = String((err && err.message) || err || '');
    let text = '페이지를 새로고침해 주세요. 계속 안 되면 최신 Chrome, Safari, Edge에서 열어 주세요.';
    if (/WebGL/i.test(msg)) text = '이 기기나 브라우저에서 WebGL 2를 쓸 수 없어요. 그래픽 가속을 켜거나 다른 브라우저에서 열어 주세요.';
    else if (/DecompressionStream/.test(msg)) text = '브라우저가 오래되어 게임 파일을 풀 수 없어요. 브라우저를 최신 버전으로 업데이트해 주세요.';
    else if (/WebAssembly|CompileError|wasm/i.test(msg)) text = '이 브라우저가 게임 엔진(WebAssembly) 실행을 막았어요. 최신 Chrome, Safari, Edge에서 열어 주세요.';
    document.getElementById('error-text').textContent = text;
    document.getElementById('error-detail').textContent = msg;
    document.getElementById('error').hidden = false;
    document.getElementById('step').textContent = '불러오기 실패';
  }
  if (typeof Engine === 'undefined') { fail(new Error('index.js did not load')); return; }
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length) { fail(new Error(missing.join(', '))); return; }
  const engine = new Engine(GODOT_CONFIG);
  engine.startGame({
    onProgress: function (current, total) {
      if (total > 0 && current >= total) {
        document.getElementById('step').textContent = '게임 엔진 준비 중';
        window.__loaderProgress(0.97);
      }
    },
  }).then(function () {
    window.__loaderProgress(1);
    loader.classList.add('gone');
    setTimeout(function () { loader.hidden = true; }, 600);
    document.getElementById('canvas').focus();
  }, fail);
}());
</script>
</body>
</html>
