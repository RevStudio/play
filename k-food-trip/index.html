  <body>
    <div id="game"></div>

    <div id="hud">
      <div class="pill" id="timer" aria-label="Time left"><img data-icon="ui_hourglass" alt="" /><b id="time">30</b></div>
      <div class="pill" id="score" aria-label="Dishes made"><img data-icon="kimbap_4" alt="" /><b id="dishes">0</b><small>dishes</small></div>
      <button id="mute" type="button" aria-label="Sound off. Turn sound on" aria-pressed="false"></button>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <div id="start" class="overlay" role="dialog" aria-labelledby="start-title">
      <div class="card">
        <div class="dishes"><img data-icon="kimbap_5" alt="" /><img data-icon="tteokbokki_5" alt="" /><img data-icon="mandu_5" alt="" /></div>
        <h1 id="start-title">K-Food Trip</h1>
        <p>Tap the rice sack, then drag two matching items together.<br />How many dishes can you make in <b>30 seconds</b>?</p>
        <button id="play" class="btn" type="button">Loading…</button>
      </div>
    </div>

    <div id="timesup" hidden>Time's up!</div>

    <div id="result" class="overlay" role="dialog" aria-labelledby="result-title" hidden>
      <div class="card">
        <h2 id="result-title">Time's up!</h2>
        <div class="final"><b id="final">0</b><span id="final-label">dishes made</span></div>
        <p class="tag" id="best"></p>
        <a id="store" class="btn store" href="https://play.google.com/store/apps/details?id=com.revstudio.kfoodtrip" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3.4v17.2c0 .8.9 1.3 1.6.9l14.3-8.6c.7-.4.7-1.4 0-1.8L6.6 2.5C5.9 2.1 5 2.6 5 3.4z" /></svg>
          Continue on Google Play
        </a>
        <button id="again" class="btn ghost" type="button">Play again</button>
      </div>
    </div>

    <noscript>
      <p style="position:fixed;inset:0;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:#f6e7cf">

      </p>
